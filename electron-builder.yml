appId: mx.jerfarias.nubeless.desktop
productName: Nubeless
copyright: Copyright © 2026 Jesus Fernando Farias Nambo

directories:
  buildResources: build
  output: dist

# electron-vite bundlea todo — solo necesitamos out/ y la native lib
files:
  - out/**/*
  - node_modules/better-sqlite3/**/*
  - node_modules/bindings/**/*
  - node_modules/file-uri-to-path/**/*
  - "!node_modules/**/.github/**"
  - "!node_modules/**/test/**"
  - "!node_modules/**/docs/**"

# el BrowserWindow lee el PNG desde process.resourcesPath
extraResources:
  - from: build/icon.png
    to: icon.png

asarUnpack:
  - node_modules/better-sqlite3/**/*
  - node_modules/bindings/**/*
  - node_modules/file-uri-to-path/**/*

mac:
  category: public.app-category.utilities
  icon: build/icon.icns
  target:
    - target: dmg
      arch: [x64, arm64]
  darkModeSupport: true

dmg:
  title: Nubeless
  backgroundColor: "#1a1a2e"
  window:
    width: 540
    height: 380

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: msix
      arch: [x64]

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  shortcutName: Nubeless

# Identidad real de Partner Center (app "Nubeless", tipo MSIX o PWA, reservada 2026-09-22).
msix:
  identityName: JesusFernandoFariasNambo.Nubeless
  publisher: "CN=B76C790E-1B64-4187-A7FD-D53596AD247D"
  publisherDisplayName: Jesus Fernando Farias Nambo
  displayName: Nubeless
  applicationId: Nubeless
  createMsixupload: true

linux:
  icon: build/icon.png
  category: Utility
  target:
    - target: AppImage
      arch: [x64]
